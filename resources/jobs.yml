# Orquestração por eventos (ADR-0006, revisado):
#   - DENTRO do domínio: um job disparado por FILE ARRIVAL (Capture grava .avro) com as camadas
#     encadeadas Bronze -> Silver -> Gold. Sem cron; uma execução serverless por lote de arquivos.
#   - ENTRE domínios: consumidores de data products já publicados usam TABLE UPDATE triggers
#     (ex.: o Gold consolidado pedidos x pagamentos, Fase 5). A Databricks exige que a tabela
#     do trigger exista na criação do job; tabelas próprias de um domínio novo ainda não existem.
resources:
  jobs:
    pedidos_pipeline:
      name: pedidos-pipeline-${bundle.target}
      description: Capture -> Bronze (edp-ingestion) -> Silver (edp-etl + contrato ODCS) -> Gold (domínio)
      max_concurrent_runs: 1
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: ${var.capture_url}
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: bronze
          environment_key: bronze
          python_wheel_task:
            package_name: edp_ingestion
            entry_point: edp-ingestion
            parameters:
              - --config
              - ${workspace.file_path}/config/bronze.yml
              - --var
              - catalog=${var.catalog}
              - --var
              - capture_url=${var.capture_url}

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: silver
          python_wheel_task:
            package_name: edp_etl
            entry_point: edp-etl
            parameters:
              - --config
              - ${workspace.file_path}/config/silver.yml
              - --var
              - catalog=${var.catalog}
              - --var
              - contract_ref=${var.contract_ref}

        - task_key: gold_pedidos_por_status_diario
          depends_on:
            - task_key: silver
          environment_key: gold
          spark_python_task:
            python_file: ../src/gold/pedidos_por_status_diario.py
            parameters:
              - ${var.catalog}

      environments:
        - environment_key: bronze
          spec:
            environment_version: "4"
            dependencies:
              - edp-ingestion @ ${var.ingestion_wheel}
        - environment_key: silver
          spec:
            environment_version: "4"
            dependencies:
              - edp-etl @ ${var.etl_wheel}
        - environment_key: gold
          spec:
            environment_version: "4"
